name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # numpy 2.5.x requires Python >= 3.12, so 3.12 (the Streamlit Community Cloud
        # default) and 3.13 are the versions the pinned stack can actually run on.
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e . --no-deps

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy

      # No network access is needed or wanted: example CSVs are committed, so a flaky
      # dataset host can never break CI.
      - name: Test
        run: pytest --cov=faircheck --cov-report=term-missing
